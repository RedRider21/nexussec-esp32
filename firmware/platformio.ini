; NexusSec ESP32 — firmware nostro (Opzione B)
; Target: ESP32-S3 (scheda ESP32-DIV V2). Display ILI9341 320x240 (SPI).
;
; NOTA PIN: i pin qui sotto sono quelli usati dal simulatore Wokwi
; (vedi diagram.json). Sulla ESP32-DIV V2 REALE vanno messi i pin veri del
; suo schema: si cambiano SOLO in questo file (le -D TFT_*), senza toccare il
; codice. Finche' non abbiamo lo schema definitivo della scheda, usiamo i pin
; del simulatore per poter provare tutto nel browser.

[env:esp32-div-v2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    nrf24/RF24 @ ^1.4.11
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git

build_flags =
    ; --- brand / build ---
    -D NXS_FW_VERSION="\"0.1.0\""
    -D NXS_TARGET_SIM=1
    ; --- TFT_eSPI: display ILI9341 con i PIN REALI della ESP32-DIV V2 ---
    ;     (bus SPI dedicato del display; i radio usano un bus separato 12/13/11)
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=37
    -D TFT_MOSI=35
    -D TFT_SCLK=36
    -D TFT_CS=17
    -D TFT_DC=16
    -D TFT_RST=0
    -D TOUCH_CS=18
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
